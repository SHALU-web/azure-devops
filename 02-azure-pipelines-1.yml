
trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: Firstjob
    steps:
    - bash: echo first Build job
    - bash: echo $(PipelineLevelVariable)
  - job: SecondJob
    steps:
    - bash: echo second Build job
- stage: DevDeploy
  variables:
    environment: Dev
  dependsOn: Build
  jobs:
  - job: FirstDevDeploy
    steps: 
    - bash: echo $(environment) job
- stage: QADeploy
  dependsOn: Build
  jobs:
  - job: FirstQADeploy
    steps: 
    - bash: echo first QADeploy  job
- stage: ProdDeploy
  jobs:
  - job: FirstProdDeploy
    steps: 
    - bash: echo first ProdDeploy  job

